name: Suggest an Embodied RSI resource
description: Propose a paper, system, dataset, benchmark, survey, or official update.
title: "[Resource]: "
labels: ["candidate"]
body:
  - type: input
    id: title
    attributes:
      label: Title
    validations:
      required: true
  - type: input
    id: primary_source
    attributes:
      label: Primary source URL
      description: Paper, official project page, official repository, or official announcement.
    validations:
      required: true
  - type: input
    id: venue
    attributes:
      label: Publication venue
      description: Conference, journal, or preprint status; use N/A for non-paper resources.
    validations:
      required: true
  - type: dropdown
    id: source_status
    attributes:
      label: Source status
      description: Open-source requires an explicit open-source license.
      options: ["Open-source", "Closed-source"]
    validations:
      required: true
  - type: checkboxes
    id: evaluation_environments
    attributes:
      label: Evaluation environments
      description: Select every environment supported by primary-source evidence.
      options:
        - label: Real-machine
        - label: Simulation
  - type: dropdown
    id: rsi_level
    attributes:
      label: Proposed RSI level
      options: ["L0 — Embodied", "L1 — Adaptive", "L2 — Self-Improving", "L3 — Recursive", "L4 — Open-Ended"]
    validations:
      required: true
  - type: textarea
    id: persistence
    attributes:
      label: What persists or recursively improves?
      description: Identify the model, policy, memory, skill, harness, embodiment, or improvement process and cite evidence.
    validations:
      required: true
